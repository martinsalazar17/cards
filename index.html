<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC Billing Statement</title>
<style>
  *{
    box-sizing: border-box;
    transition: all .15s ease 0s;
  }
  :root{
    --movement: 0.85;
    --stop: 0.5;
    --duration: calc((var(--movement) * (1 / var(--stop))));
    --stagger: 0.1125;
    --perspective: 500;
    --size: 50;
    --ease: cubic-bezier(1, -0.52, .26, .89);
    --bg: hsl(0, 0%, 90%);
    --panel: hsl(0, 0%, 100%);
    --color: hsl(0, 0%, 5%);
    --hue: 23;
    --saturation: 100;
    --lightness: 55;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: hsl(0, 0%, 10%);
      --panel: hsl(0, 0%, 0%);
      --color: hsl(0, 0%, 95%);
    }
  }
  html, body{
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  body{
    align-items: center;
    background: var(--bg);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ── LOADER ── */
  #loader{
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    transition: opacity .5s ease, visibility .5s ease;
  }
  #loader.hide{
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .scene{
    perspective: calc(var(--perspective) * 1px);
  }
  .word{
    display: flex;
    transform: translate(calc(var(--size) * 0.7px), 0) rotateX(-30deg) rotateY(45deg);
    transform-style: preserve-3d;
  }
  .letter__wrap{
    animation: jump calc(var(--duration) * 1s) calc((var(--stagger, 0) * var(--index, 0)) * 1s) var(--ease) infinite;
    transform-origin: bottom center;
    transform-style: preserve-3d;
  }
  .letter__wrap .letter{
    animation: rotate calc(var(--duration) * 4s) calc((var(--stagger, 0) * var(--index, 0)) * 1s) ease infinite;
  }
  .letter{
    color: var(--color);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 2rem;
    font-weight: bold;
    height: calc(var(--size) * 1px);
    margin-right: calc(var(--size) * 0.2px);
    position: relative;
    text-transform: uppercase;
    transform-style: preserve-3d;
    width: calc(var(--size) * 1px);
  }
  .letter__panel{
    align-items: center;
    background: var(--panel);
    border: 5px hsl(calc(var(--hue) * 1deg) calc(var(--saturation) * 1%) calc(var(--lightness) * 1%)) solid;
    display: flex;
    height: calc(var(--size) * 1px);
    justify-content: center;
    left: 50%;
    position: absolute;
    top: 50%;
    width: calc(var(--size) * 1px);
  }
  .letter__panel:nth-of-type(1){
    transform: translate3d(-50%, -50%, 0) translate3d(0, 0, calc(var(--size) * 0.5px));
  }
  .letter__panel:nth-of-type(2){
    transform: translate3d(-50%, -50%, 0) rotateX(90deg) translate3d(0, 0, calc(var(--size) * 0.5px));
  }
  .letter__panel:nth-of-type(3){
    transform: translate3d(-50%, -50%, 0) rotateX(180deg) translate3d(0, 0, calc(var(--size) * 0.5px));
  }
  .letter__panel:nth-of-type(4){
    transform: translate3d(-50%, -50%, 0) rotateX(-90deg) translate3d(0, 0, calc(var(--size) * 0.5px));
  }
  .letter__panel:nth-of-type(5){
    transform: translate3d(-50%, -50%, 0) rotateY(-90deg) translate3d(0, 0, calc(var(--size) * 0.5px));
  }
  @keyframes rotate{
    0%, 30.625%{
      transform: rotateX(0deg);
    }
    33.125%, 81.625%{
      transform: rotateX(90deg);
    }
    83.125%, 100%{
      transform: rotateX(180deg);
    }
  }
  @keyframes jump{
    0%, 50%, 100%{
      transform: scaleX(1) scaleY(1) translate(0, 0);
    }
    15%{
      transform: scaleX(1.2) scaleY(0.8) translate(0, 0);
    }
    25%{
      transform: scaleX(0.9) scaleY(1.1) translate(0, -100%);
    }
  }

  /* ── APP IFRAME ── */
  #app-frame{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    opacity: 0;
    transition: opacity .5s ease;
  }
  #app-frame.show{
    opacity: 1;
  }
</style>
</head>
<body>

  <div id="loader">
    <div class="scene">
      <div class="word">
        <div class="letter__wrap" style="--index:0">
          <div class="letter">
            <span class="letter__panel">C</span>
            <span class="letter__panel">C</span>
            <span class="letter__panel">C</span>
            <span class="letter__panel">C</span>
            <span class="letter__panel">C</span>
          </div>
        </div>
        <div class="letter__wrap" style="--index:1">
          <div class="letter">
            <span class="letter__panel">A</span>
            <span class="letter__panel">A</span>
            <span class="letter__panel">A</span>
            <span class="letter__panel">A</span>
            <span class="letter__panel">A</span>
          </div>
        </div>
        <div class="letter__wrap" style="--index:2">
          <div class="letter">
            <span class="letter__panel">R</span>
            <span class="letter__panel">R</span>
            <span class="letter__panel">R</span>
            <span class="letter__panel">R</span>
            <span class="letter__panel">R</span>
          </div>
        </div>
        <div class="letter__wrap" style="--index:3">
          <div class="letter">
            <span class="letter__panel">D</span>
            <span class="letter__panel">D</span>
            <span class="letter__panel">D</span>
            <span class="letter__panel">D</span>
            <span class="letter__panel">D</span>
          </div>
        </div>
        <div class="letter__wrap" style="--index:4">
          <div class="letter">
            <span class="letter__panel">S</span>
            <span class="letter__panel">S</span>
            <span class="letter__panel">S</span>
            <span class="letter__panel">S</span>
            <span class="letter__panel">S</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbwlVZ4QjwNSm0wVq2txkpb2MZwJvyJ11UJlIDBblxE1K9XmSx5SzYKHHMkGGnD2pGhkbw/exec"
    allow="clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <script>
    var frame  = document.getElementById('app-frame');
    var loader = document.getElementById('loader');
    var revealed = false;

    function reveal() {
      if (revealed) return;
      revealed = true;
      frame.classList.add('show');
      loader.classList.add('hide');
    }

    frame.addEventListener('load', reveal);
    // Fallback in case the load event doesn't fire as expected
    // (e.g. cross-origin quirks with Apps Script redirects).
    setTimeout(reveal, 4000);
  </script>

</body>
</html>
