<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05262b">
<meta name="color-scheme" content="dark">
<title>CC Billing Statement</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg-fallback:#031a1d;
    --grain:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,0));
    --card-tint:rgba(8,24,28,0.40);
    --card-glow:0 30px 70px -30px rgba(0,0,0,.65),0 2px 8px rgba(0,0,0,.22);
    --inner:rgba(255,255,255,0.055);
    --outline:rgba(255,255,255,0.20);
    --field:rgba(255,255,255,0.07);
    --field-border:rgba(255,255,255,0.20);
    --ink:#F5F7FB; --ink-2:#D5DAE7; --ink-3:#BAC1D3;
    --accent:#A5CBFF; --accent-glow:rgba(143,186,255,0.20); --accent-solid:#1E3A5F;
    --red-bg:rgba(239,68,68,0.16); --red-ink:#FECACA; --red-edge:rgba(239,68,68,0.34);
    --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-d:'Sora','DM Sans',system-ui,sans-serif;
    /* cube loader */
    --movement:0.85; --stop:0.5; --duration:calc((var(--movement) * (1 / var(--stop))));
    --stagger:0.1125; --perspective:500; --size:50; --ease:cubic-bezier(1,-0.52,.26,.89);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; padding:0; overflow:hidden; }
  body{
    background:var(--bg-fallback); color:var(--ink); font-family:var(--font);
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; }

  /* grainy dark-teal gradient with minimal streaks of light */
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-color:var(--bg-fallback);
    background-image:
      var(--grain),
      linear-gradient(104deg,rgba(190,255,248,0) 22%,rgba(190,255,248,0.075) 22.5%,rgba(190,255,248,0.02) 23.7%,rgba(190,255,248,0) 25.5%),
      linear-gradient(112deg,rgba(150,240,232,0) 61%,rgba(150,240,232,0.055) 61.4%,rgba(150,240,232,0) 63.2%),
      linear-gradient(121deg,rgba(120,230,225,0) 40%,rgba(120,230,225,0.05) 46%,rgba(120,230,225,0) 55%),
      radial-gradient(circle at 12% 6%,rgba(52,170,178,0.30) 0%,rgba(52,170,178,0) 42%),
      radial-gradient(circle at 92% 98%,rgba(8,70,78,0.60) 0%,rgba(8,70,78,0) 48%),
      linear-gradient(160deg,#031a1d 0%,#06292e 40%,#0a3b41 70%,#062a2f 100%);
    background-size:180px 180px,auto,auto,auto,auto,auto,auto;
    background-repeat:repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat;
  }

  /* ══════════════ LOGIN SCREEN ══════════════ */
  #login-screen{
    position:fixed; inset:0; z-index:20000;
    display:flex; align-items:center; justify-content:center; padding:20px;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #login-screen.hide{ opacity:0; visibility:hidden; pointer-events:none; }

  .glass-card{
    position:relative; isolation:isolate; overflow:hidden;
    width:380px; max-width:100%;
    padding:40px 32px 32px; border-radius:28px; text-align:center;
    background-color:var(--card-tint);
    background-image:linear-gradient(135deg,rgba(255,255,255,0.085),rgba(255,255,255,0.02) 38%,rgba(255,255,255,0) 62%);
    -webkit-backdrop-filter:blur(8px) saturate(150%); backdrop-filter:blur(8px) saturate(150%);
    box-shadow:var(--card-glow);
    animation:reveal .6s cubic-bezier(.16,.8,.24,1) both;
  }
  .glass-card::before{
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,0.70),rgba(255,255,255,0.22) 18%,rgba(255,255,255,0.07) 45%,rgba(255,255,255,0.07) 75%,rgba(255,255,255,0.26));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }
  @keyframes reveal{
    from{ opacity:0; transform:translateY(16px); filter:blur(6px); }
    to{ opacity:1; transform:none; filter:none; }
  }
  .glass-card.shake{ animation:shake .45s ease; }
  @keyframes shake{
    10%,90%{ transform:translateX(-2px); }
    20%,80%{ transform:translateX(4px); }
    30%,50%,70%{ transform:translateX(-8px); }
    40%,60%{ transform:translateX(8px); }
  }

  .lock-icon{
    width:56px; height:56px; margin:0 auto 18px; border-radius:50%;
    border:1px solid var(--outline); background:transparent;
    display:flex; align-items:center; justify-content:center; color:var(--ink-2);
  }
  .lock-icon svg{ width:24px; height:24px; stroke:currentColor; }

  .glass-card h1{
    color:var(--ink); font-family:var(--font-d); font-size:17px; font-weight:700;
    margin:0 0 6px; letter-spacing:0;
  }
  .glass-card p.sub{ color:var(--ink-3); font-size:13px; margin:0 0 26px; }

  .field{ position:relative; margin-bottom:14px; text-align:left; }
  .field input{
    width:100%; padding:13px 16px; padding-right:44px; border-radius:14px;
    border:1.5px solid var(--field-border); background:var(--field);
    color:var(--ink); font-family:var(--font); font-size:14px; outline:none;
    -webkit-appearance:none; transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .field input::placeholder{ color:var(--ink-3); }
  .field input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); background:rgba(255,255,255,0.11); }
  .field input:-webkit-autofill{ -webkit-box-shadow:0 0 0 100px #1A2130 inset; -webkit-text-fill-color:#F5F7FB; caret-color:#F5F7FB; }
  .toggle-eye{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    cursor:pointer; width:20px; height:20px; stroke:var(--ink-3); transition:stroke .15s;
  }
  .toggle-eye:hover{ stroke:var(--ink); }

  .signin-btn{
    width:100%; padding:13px; margin-top:8px; border:none; border-radius:12px;
    background:linear-gradient(180deg,#FFFFFF 0%,#D6E6FF 100%); color:var(--accent-solid);
    font-family:var(--font-d); font-size:14px; font-weight:700; cursor:pointer;
    box-shadow:0 6px 18px -6px rgba(165,203,255,0.55);
    transition:transform .15s, filter .15s;
  }
  .signin-btn:hover{ filter:brightness(1.04); transform:translateY(-1px); }
  .signin-btn:active{ transform:scale(.98); }

  .error-msg{
    margin-top:14px; padding:9px 12px; border-radius:12px;
    background:var(--red-bg); color:var(--red-ink); border:1px solid var(--red-edge);
    font-size:12.5px; font-weight:600; line-height:1.45;
    opacity:0; visibility:hidden; transition:opacity .2s ease;
  }
  .error-msg.show{ opacity:1; visibility:visible; }

  /* ══════════════ CUBE LOADER ══════════════ */
  #loader{
    position:fixed; inset:0; z-index:10000; display:none;
    align-items:center; justify-content:center;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #loader.visible{ display:flex; }
  #loader.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .scene{ perspective:calc(var(--perspective) * 1px); }
  .word{
    display:flex;
    transform:translate(calc(var(--size) * 0.7px),0) rotateX(-30deg) rotateY(45deg);
    transform-style:preserve-3d;
  }
  .letter__wrap{
    animation:jump calc(var(--duration) * 1s) calc((var(--stagger,0) * var(--index,0)) * 1s) var(--ease) infinite;
    transform-origin:bottom center; transform-style:preserve-3d;
  }
  .letter__wrap .letter{
    animation:rotate calc(var(--duration) * 4s) calc((var(--stagger,0) * var(--index,0)) * 1s) ease infinite;
  }
  .letter{
    color:var(--ink); font-family:var(--font-d); font-size:1.7rem; font-weight:800;
    height:calc(var(--size) * 1px); margin-right:calc(var(--size) * 0.2px);
    position:relative; text-transform:uppercase; transform-style:preserve-3d;
    width:calc(var(--size) * 1px);
  }
  .letter__panel{
    align-items:center; background:rgba(8,30,35,0.92);
    border:3px solid rgba(165,203,255,0.85);
    box-shadow:inset 0 0 14px rgba(165,203,255,0.18);
    display:flex; height:calc(var(--size) * 1px); justify-content:center;
    left:50%; position:absolute; top:50%; width:calc(var(--size) * 1px);
  }
  .letter__panel:nth-of-type(1){ transform:translate3d(-50%,-50%,0) translate3d(0,0,calc(var(--size) * 0.5px)); }
  .letter__panel:nth-of-type(2){ transform:translate3d(-50%,-50%,0) rotateX(90deg) translate3d(0,0,calc(var(--size) * 0.5px)); }
  .letter__panel:nth-of-type(3){ transform:translate3d(-50%,-50%,0) rotateX(180deg) translate3d(0,0,calc(var(--size) * 0.5px)); }
  .letter__panel:nth-of-type(4){ transform:translate3d(-50%,-50%,0) rotateX(-90deg) translate3d(0,0,calc(var(--size) * 0.5px)); }
  .letter__panel:nth-of-type(5){ transform:translate3d(-50%,-50%,0) rotateY(-90deg) translate3d(0,0,calc(var(--size) * 0.5px)); }
  @keyframes rotate{
    0%,30.625%{ transform:rotateX(0deg); }
    33.125%,81.625%{ transform:rotateX(90deg); }
    83.125%,100%{ transform:rotateX(180deg); }
  }
  @keyframes jump{
    0%,50%,100%{ transform:scaleX(1) scaleY(1) translate(0,0); }
    15%{ transform:scaleX(1.2) scaleY(0.8) translate(0,0); }
    25%{ transform:scaleX(0.9) scaleY(1.1) translate(0,-100%); }
  }

  /* ══════════════ APP IFRAME ══════════════ */
  #app-frame{
    position:fixed; inset:0; width:100vw; height:100vh; height:100dvh;
    border:none; background:transparent; opacity:0; transition:opacity .5s ease;
  }
  #app-frame.show{ opacity:1; }

  /* ══════════════ ACCESSIBILITY ══════════════ */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; animation-delay:0s !important; transition-duration:.001ms !important; }
  }
  @media (prefers-reduced-transparency:reduce){
    .glass-card{ background-color:#11151C; background-image:none; -webkit-backdrop-filter:none; backdrop-filter:none; }
  }
  @media (prefers-contrast:more){ .glass-card{ background-color:rgba(14,17,23,0.94); } }
  @supports not ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){
    .glass-card{ background-color:#11151C; }
  }

  /* ── BORDERLESS (v2.1): no borders or outlines; fills and spacing only ── */
  *,*::before,*::after{ border:0 !important; }
  .glass-card::before{ display:none !important; }
  .lock-icon{ background:rgba(255,255,255,0.09); }
  .field input{ background:rgba(255,255,255,0.09); }
  .field input:focus{ background:rgba(255,255,255,0.13); }
  .letter__panel{ background:#2b5566; box-shadow:inset 0 0 18px rgba(165,203,255,0.28); backface-visibility:hidden; }
</style>
<script>
  /* film-grain tile, generated once (no image file needed) */
  (function () {
    try {
      var n = 160, c = document.createElement('canvas'); c.width = c.height = n;
      var x = c.getContext('2d'), d = x.createImageData(n, n), i;
      for (i = 0; i < d.data.length; i += 4) {
        var light = Math.random() < 0.5 ? 255 : 0;
        d.data[i] = d.data[i + 1] = d.data[i + 2] = light;
        d.data[i + 3] = Math.floor(Math.random() * (light ? 22 : 30));
      }
      x.putImageData(d, 0, 0);
      document.documentElement.style.setProperty('--grain', 'url(' + c.toDataURL('image/png') + ')');
    } catch (e) {}
  })();
</script>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <form class="glass-card" id="login-form" autocomplete="off">
      <div class="lock-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="10" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
      </div>
      <h1>CC Billing Statement</h1>
      <p class="sub">Sign in to view your cards</p>

      <div class="field">
        <input type="text" id="username" placeholder="Username" autocomplete="off">
      </div>
      <div class="field">
        <input type="password" id="password" placeholder="Password" autocomplete="off">
        <svg class="toggle-eye" id="eye" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </div>

      <button type="submit" class="signin-btn">Sign In</button>
      <div class="error-msg" id="error-msg">Incorrect username or password.</div>
    </form>
  </div>

  <!-- LOADER -->
  <div id="loader">
    <div class="scene">
      <div class="word">
        <div class="letter__wrap" style="--index:0"><div class="letter"><span class="letter__panel">C</span><span class="letter__panel">C</span><span class="letter__panel">C</span><span class="letter__panel">C</span><span class="letter__panel">C</span></div></div>
        <div class="letter__wrap" style="--index:1"><div class="letter"><span class="letter__panel">A</span><span class="letter__panel">A</span><span class="letter__panel">A</span><span class="letter__panel">A</span><span class="letter__panel">A</span></div></div>
        <div class="letter__wrap" style="--index:2"><div class="letter"><span class="letter__panel">R</span><span class="letter__panel">R</span><span class="letter__panel">R</span><span class="letter__panel">R</span><span class="letter__panel">R</span></div></div>
        <div class="letter__wrap" style="--index:3"><div class="letter"><span class="letter__panel">D</span><span class="letter__panel">D</span><span class="letter__panel">D</span><span class="letter__panel">D</span><span class="letter__panel">D</span></div></div>
        <div class="letter__wrap" style="--index:4"><div class="letter"><span class="letter__panel">S</span><span class="letter__panel">S</span><span class="letter__panel">S</span><span class="letter__panel">S</span><span class="letter__panel">S</span></div></div>
      </div>
    </div>
  </div>

  <!-- APP -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbwlVZ4QjwNSm0wVq2txkpb2MZwJvyJ11UJlIDBblxE1K9XmSx5SzYKHHMkGGnD2pGhkbw/exec"
    allow="clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <script>
    var VALID_USER = 'alvinmartinsalazar17';
    var VALID_PASS = 'usc12345';

    var loginScreen = document.getElementById('login-screen');
    var loader      = document.getElementById('loader');
    var frame       = document.getElementById('app-frame');
    var form        = document.getElementById('login-form');
    var errorMsg    = document.getElementById('error-msg');
    var card        = document.querySelector('.glass-card');
    var eye         = document.getElementById('eye');
    var passInput   = document.getElementById('password');

    var frameLoaded = false;
    var loggedIn    = false;

    frame.addEventListener('load', function () {
      frameLoaded = true;
      if (loggedIn) reveal();
    });

    function reveal() {
      frame.classList.add('show');
      loader.classList.add('hide');
      setTimeout(function () { loader.classList.remove('visible'); }, 500);
    }

    function proceedPastLogin() {
      loggedIn = true;
      loginScreen.classList.add('hide');
      if (frameLoaded) {
        reveal();
      } else {
        loader.classList.add('visible');
      }
    }

    // Skip login if already authenticated this browser session
    if (sessionStorage.getItem('cc_auth') === '1') {
      loginScreen.style.display = 'none';
      proceedPastLogin();
    }

    eye.addEventListener('click', function () {
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var u = document.getElementById('username').value.trim();
      var p = passInput.value;

      if (u === VALID_USER && p === VALID_PASS) {
        sessionStorage.setItem('cc_auth', '1');
        errorMsg.classList.remove('show');
        proceedPastLogin();
      } else {
        errorMsg.classList.add('show');
        card.classList.remove('shake');
        void card.offsetWidth; // restart animation
        card.classList.add('shake');
        passInput.value = '';
        passInput.focus();
      }
    });

    // Fallback in case the iframe load event doesn't fire as expected
    setTimeout(function () {
      frameLoaded = true;
      if (loggedIn) reveal();
    }, 4000);
  </script>

</body>
</html>
